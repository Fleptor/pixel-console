<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL_OS // RECOVERY_TERMINAL</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="scanlines"></div>

    <div id="terminal">
        <div id="output">
            <p>PIXEL OS v3.1.4 - KERNEL PANIC</p>
            <p class="error">SYSTEM HALTED AT 18:42. SUBSYSTEMS OFFLINE.</p>
            <p>Recover the four fragments from your diagnostic archive.</p>
            <p>Type 'help' for commands, then submit the fragments in recovery order.</p>
            
            </div>
        
        <div id="input-line">
            <span id="prompt">guest@PixBox:~$</span>
            <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
